kind = "web"
previewPath = "/"
title = "Pursuit Bank — Mortgage Loan System"
version = "1.0.0"
id = "artifacts/pursuit-bank"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24405

[services.development]
run = "pnpm --filter @workspace/pursuit-bank run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pursuit-bank", "run", "build" ]
publicDir = "artifacts/pursuit-bank/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24405"
BASE_PATH = "/"
